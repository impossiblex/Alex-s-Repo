- name: Clone CMS repository from GitHub
  delegate_to: localhost
  git:
    repo: "{{ repo }}"
    dest: "/tmp/movewellapp-cms"
    clone: yes
    update: yes

- name: Ensure that movewellapp-cms directory exists
  file:
    path: "{{ deployment_root }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"

- name: Upload docker compose config
  copy:
    src: /tmp/movewellapp-cms/docker-compose.yml
    dest: "{{ deployment_root }}/docker-compose.yml"
  notify:
    - Restart movewellapp-cms

- name: Check if SSL certificate exists
  become: true
  stat:
    path: "/etc/letsencrypt/live/{{ domain_name }}/fullchain.pem"
  register: ssl_cert

- name: Create temporary HTTP-only nginx config for certificate request
  become: true
  copy:
    content: |
      server {
          listen 80;
          server_name {{ domain_name }};

          location /.well-known/acme-challenge/ {
              root /var/www/certbot;
          }

          location / {
              return 200 'Server is being configured';
              add_header Content-Type text/plain;
          }
      }
    dest: "/etc/nginx/conf.d/{{ domain_name }}.conf"
  when: not ssl_cert.stat.exists

- name: Create certbot webroot directory
  become: true
  file:
    path: /var/www/certbot
    state: directory
    mode: '0755'
  when: not ssl_cert.stat.exists

- name: Reload nginx to apply temporary config
  become: true
  systemd:
    name: nginx
    state: reloaded
  when: not ssl_cert.stat.exists

- name: Obtain SSL certificate using webroot
  become: true
  shell: |
    certbot certonly --webroot -w /var/www/certbot -d {{ domain_name }} --non-interactive --agree-tos --email {{ letsencrypt_email | default('alex@mealmanifest.com') }}
  args:
    creates: /etc/letsencrypt/live/{{ domain_name }}/fullchain.pem
  when: not ssl_cert.stat.exists

- name: Upload nginx configs with SSL
  become: true
  copy:
    src: /tmp/movewellapp-cms/etc/nginx/
    dest: "/etc/nginx/conf.d/"
  notify:
    - Restart nginx

- name: Validate nginx config
  become: true
  shell: nginx -t

- name: Renew SSL certificate if needed
  become: true
  shell: |
    certbot renew --quiet --post-hook "systemctl reload nginx" || true

- name: Login to Docker registry
  shell: |
    echo "{{ docker_hub.password }}" | docker login ghcr.io --username {{ docker_hub.username }} --password-stdin
  no_log: true
  ignore_errors: yes
  when: docker_hub.password is defined and docker_hub.password != ""

- name: Ensure that systemd dir exists
  file:
    path: "/home/{{ ansible_user }}/.config/systemd/user/"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"

- name: Create movewellapp-cms systemd service file
  template:
    src: "movewellapp-cms.service.j2"
    dest: "/home/{{ ansible_user }}/.config/systemd/user/{{ service_name }}.service"
    mode: "0644"
  notify:
    - Reload movewellapp-cms
